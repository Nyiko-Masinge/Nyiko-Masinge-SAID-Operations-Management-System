name: CI and gated delivery
on:
  push:
    branches: ['feature/**', integration/final, development, main]
  pull_request:
    branches: [integration/final, development, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/') || github.ref == 'refs/heads/integration/final' }}
env:
  NO_COLOR: '1'
  CI: 'true'
jobs:
  repository:
    name: Repository hygiene and release scope
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.changes.outputs.heavy }}
      mobile: ${{ steps.changes.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: bash scripts/check-repository-hygiene.sh
      - id: changes
        run: node scripts/ci-changes.cjs
      - name: Check branch whitespace
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BEFORE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
  web:
    name: Web locked install, lint and production build
    needs: repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SAID Ops/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: SAID Ops/web-app/package-lock.json
      - run: test "$(npm --version)" = 10.9.9
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  mobile:
    name: Mobile locked install, typecheck and Expo config
    needs: repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SAID Ops/mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: SAID Ops/mobile-app/package-lock.json
      - run: test "$(npm --version)" = 10.9.9
      - run: npm ci
      - run: npm run typecheck
      - run: npx --no-install expo config --type public
  deterministic:
    name: Stage 6/7, trusted progress, WS probes and monitoring
    needs: repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: test "$(npm --version)" = 10.9.9
      - run: npm ci --prefix 'SAID Ops/web-app'
      - run: npm ci --prefix 'SAID Ops/mobile-app'
      - run: node scripts/run-release-gates.cjs deterministic
  firestore-rules:
    name: Original 193 security tests and additional rules
    needs: repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: test "$(npm --version)" = 10.9.9
      - run: npm ci --prefix security-tests
      - run: npm install --global firebase-tools@15.25.0
      - name: Run security suites and preserve certified counts
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-release-gates.cjs rules | tee "$RUNNER_TEMP/security-tests.log"
          grep -Eq '^# tests 193$' "$RUNNER_TEMP/security-tests.log"
          grep -Eq '^# pass 193$' "$RUNNER_TEMP/security-tests.log"
          ! grep -Eq '^# fail [1-9][0-9]*$' "$RUNNER_TEMP/security-tests.log"
          ! grep -Eq '^# skipped [1-9][0-9]*$' "$RUNNER_TEMP/security-tests.log"
  integration:
    name: Release and backend emulator integration
    needs: repository
    if: needs.repository.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: test "$(npm --version)" = 10.9.9
      - run: npm ci --prefix 'SAID Ops/web-app'
      - run: npm ci --prefix 'SAID Ops/mobile-app'
      - run: npm ci --prefix security-tests
      - run: npm install --global firebase-tools@15.25.0
      - run: node scripts/run-release-gates.cjs integration
  deploy-cloud:
    name: Firebase and Vercel delivery
    needs: [repository, web, mobile, deterministic, firestore-rules, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') && vars.DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: cloud-delivery-${{ github.ref }}
      cancel-in-progress: false
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: test "$(npm --version)" = 10.9.9
      - name: Validate protected deployment credentials
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          node scripts/write-deploy-credentials.cjs
      - run: npm ci --prefix 'SAID Ops/web-app'
      - run: npm install --global firebase-tools@15.25.0 vercel@62.2.0
      - name: Pull and check selected Vercel project environment
        working-directory: SAID Ops/web-app
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          node ../../scripts/check-deployment-env.cjs .vercel/.env.production.local
      - name: Deploy Spark Firestore rules and indexes
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only firestore:rules,firestore:indexes --non-interactive
      - name: Build and deploy web from tested commit
        working-directory: SAID Ops/web-app
        run: |
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Remove temporary deployment credential
        if: always()
        run: rm -f "$RUNNER_TEMP/said-deploy-credential.json"
  mobile-build:
    name: EAS internal Android assessment build
    needs: [repository, web, mobile, deterministic, firestore-rules, integration, deploy-cloud]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') && vars.DEPLOYMENTS_ENABLED == 'true' && (needs.repository.outputs.mobile == 'true' || vars.EAS_FORCE_BUILD == 'true')
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: mobile-delivery-${{ github.ref }}
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: SAID Ops/mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: test "$(npm --version)" = 10.9.9
      - run: test -n "$EXPO_TOKEN"
      - run: npm ci
      - run: npm install --global eas-cli@24.10.0
      - name: Request internal APK after all release gates
        env:
          EAS_PROFILE: ${{ github.ref == 'refs/heads/main' && 'assessment' || 'preview' }}
        run: eas build --platform android --profile "$EAS_PROFILE" --non-interactive
